name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fail fast: one workflow run per ref, not per matrix cell.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Prisma generate runs on install; it needs the schema only, no database.
        run: npm ci

      - name: Regenerate Prisma client
        # Defensive: if install steps change, never fail CI on a stale client.
        run: npm run db:generate

      - name: Verify (typecheck + lint + test)
        run: npm run verify

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    env:
      # Next runs standalone output checks during build; no real database is
      # contacted during the build itself.
      DATABASE_URL: postgresql://ci-placeholder:ci-placeholder@localhost:5432/ci
      AUTH_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Confirm the standalone artifact exists
        run: test -f apps/web/.next/standalone/apps/web/server.js
